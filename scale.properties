# Any setting omitted here uses the default shown. Weights are kg, durations are ms.
# See README.md ("Tuning") before changing these.

# Step-on / step-off detection (kg above the empty-board baseline)
enterKg=5.0
exitKg=2.5

# A reading is accepted when the last stableWindowMs have std dev <= stableStdKg
stableWindowMs=1500
stableStdKg=0.15
minStabilizeMs=1000
stabilizeTimeoutMs=12000

# Zeroing the empty board at startup / reconnect
zeroWindowMs=1000
zeroStdKg=0.2
maxBaselineKg=3.0
baselineAlpha=0.002

# Filtering and plausibility
medianSamples=5
minPlausibleKg=-5
maxPlausibleKg=200

# Connection
staleMs=3000
reconnectMinMs=1000
reconnectMaxMs=30000

# Output
logLevel=INFO
diag=false
fullscreen=false
